<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">instagram-free-auto-dm</title>
  <desc id="desc">Someone comments GUIDE on your Instagram post. They get a public reply, "Sent! Check your DMs", and a direct message with your link. Free, on Instagram's own API.</desc>

  <defs>
    <!-- story ring -->
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FEDA75"/>
      <stop offset="0.3" stop-color="#FA7E1E"/>
      <stop offset="0.55" stop-color="#D62976"/>
      <stop offset="0.8" stop-color="#962FBF"/>
      <stop offset="1" stop-color="#4F5BD5"/>
    </linearGradient>
    <!-- a sent message bubble -->
    <linearGradient id="sent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A3AB9"/>
      <stop offset="1" stop-color="#4C68D7"/>
    </linearGradient>
    <path id="heart" d="M0 -5.2 C-1.6 -8.4 -7.6 -8 -7.6 -3 C-7.6 1.4 -2.4 4.6 0 6.4 C2.4 4.6 7.6 1.4 7.6 -3 C7.6 -8 1.6 -8.4 0 -5.2 Z" fill="none" stroke="#A8A8A8" stroke-width="1.6" stroke-linejoin="round"/>
  </defs>

  <!-- Machine Room palette for the frame and title: bg #0B1012, rule #26343A, ink #E9EFEC, muted #93A4A7,
       lime #C6F73F (the keyword). The two screens use Instagram's dark mode. -->
  <rect width="1200" height="400" rx="24" fill="#0B1012"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" fill="none" stroke="#26343A"/>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#93A4A7" letter-spacing="0.3">machineroom-dev / <tspan fill="#E9EFEC">instagram-free-auto-dm</tspan></text>

    <text x="0" y="160" font-size="50" font-weight="700" fill="#E9EFEC" letter-spacing="-1">Comment <tspan fill="#C6F73F">GUIDE</tspan>,</text>
    <text x="0" y="218" font-size="50" font-weight="700" fill="#E9EFEC" letter-spacing="-1">get the link in DMs.</text>

    <text x="0" y="270" font-size="21" fill="#93A4A7">Free comment-to-DM on Instagram's own API,</text>
    <text x="0" y="299" font-size="21" fill="#93A4A7">from your computer or a free Cloudflare Worker.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#93A4A7">
      <rect x="0" y="330" width="108" height="30" rx="15" fill="none" stroke="#26343A"/>
      <text x="54" y="350" text-anchor="middle">node ≥ 20</text>
      <rect x="120" y="330" width="156" height="30" rx="15" fill="none" stroke="#26343A"/>
      <text x="198" y="350" text-anchor="middle">0 dependencies</text>
      <rect x="288" y="330" width="68" height="30" rx="15" fill="none" stroke="#26343A"/>
      <text x="322" y="350" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- Screen 1: the comments on your post. Text from config.example.json. -->
  <g id="comments" transform="translate(586 38)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="276" height="324" rx="22" fill="#000000" stroke="#2C2C2E"/>
    <rect x="118" y="10" width="40" height="4" rx="2" fill="#48484A"/>
    <text x="138" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F5F5">Comments</text>
    <line x1="0" y1="56" x2="276" y2="56" stroke="#262626"/>

    <!-- the comment that asks -->
    <circle cx="30" cy="92" r="18" fill="none" stroke="url(#ring)" stroke-width="2.2"/>
    <circle cx="30" cy="92" r="14.5" fill="#6E56CF"/>
    <text x="30" y="97.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">S</text>
    <text x="58" y="86" font-size="15" fill="#A8A8A8"><tspan font-weight="700" fill="#F5F5F5">sam.makes</tspan><tspan dx="6">2m</tspan></text>
    <text x="58" y="108" font-size="17" fill="#F5F5F5">GUIDE pls 🙏</text>
    <text x="58" y="129" font-size="14" font-weight="600" fill="#A8A8A8">Reply</text>
    <use href="#heart" x="252" y="94"/>

    <!-- your public reply under it -->
    <circle cx="76" cy="160" r="15" fill="none" stroke="url(#ring)" stroke-width="2"/>
    <circle cx="76" cy="160" r="12" fill="#2A47A8"/>
    <text x="76" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Y</text>
    <text x="100" y="155" font-size="15" fill="#A8A8A8"><tspan font-weight="700" fill="#F5F5F5">your_account</tspan><tspan dx="6">1m</tspan></text>
    <text x="100" y="176" font-size="16" fill="#F5F5F5">Sent! Check your</text>
    <text x="100" y="196" font-size="16" fill="#F5F5F5">DMs 📩</text>
    <text x="100" y="216" font-size="14" font-weight="600" fill="#A8A8A8">Reply</text>
    <use href="#heart" x="252" y="162"/>

    <!-- a comment that doesn't ask: left alone -->
    <circle cx="30" cy="252" r="14.5" fill="#C2410C"/>
    <text x="30" y="257.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">L</text>
    <text x="58" y="246" font-size="15" fill="#A8A8A8"><tspan font-weight="700" fill="#F5F5F5">lena.codes</tspan><tspan dx="6">4m</tspan></text>
    <text x="58" y="267" font-size="16" fill="#F5F5F5">this is gold 🔥</text>
    <use href="#heart" x="252" y="254"/>

    <rect x="12" y="284" width="252" height="28" rx="14" fill="none" stroke="#2C2C2E"/>
    <text x="28" y="303" font-size="14" fill="#A8A8A8">Add a comment…</text>
  </g>

  <!-- Screen 2: the DM in their inbox -->
  <g id="dm" transform="translate(876 38)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="276" height="324" rx="22" fill="#000000" stroke="#2C2C2E"/>
    <path d="M24 28 L16 36 L24 44" fill="none" stroke="#F5F5F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="36" r="15" fill="none" stroke="url(#ring)" stroke-width="2"/>
    <circle cx="54" cy="36" r="12" fill="#2A47A8"/>
    <text x="54" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Y</text>
    <text x="78" y="41" font-size="16" font-weight="700" fill="#F5F5F5">your_account</text>
    <circle cx="250" cy="36" r="9.5" fill="none" stroke="#F5F5F5" stroke-width="1.8"/>
    <rect x="249" y="34.5" width="2" height="6.5" rx="1" fill="#F5F5F5"/>
    <circle cx="250" cy="31" r="1.3" fill="#F5F5F5"/>
    <line x1="0" y1="62" x2="276" y2="62" stroke="#262626"/>

    <text x="138" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#A8A8A8">Today 4:15 PM</text>

    <!-- your DM, received -->
    <circle cx="26" cy="178" r="11" fill="#2A47A8"/>
    <text x="26" y="182.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Y</text>
    <rect x="44" y="104" width="216" height="86" rx="20" fill="#262626"/>
    <text x="62" y="130" font-size="16" fill="#F5F5F5">Here's the guide from</text>
    <text x="62" y="152" font-size="16" fill="#F5F5F5">the post:</text>
    <text x="62" y="174" font-size="16" fill="#F5F5F5" text-decoration="underline">example.com/guide</text>

    <!-- their reply, sent -->
    <rect x="136" y="202" width="126" height="38" rx="19" fill="url(#sent)"/>
    <text x="199" y="226" text-anchor="middle" font-size="16" fill="#FFFFFF">thank you! 🙌</text>
    <text x="260" y="258" text-anchor="end" font-size="12" fill="#A8A8A8">Seen</text>

    <rect x="12" y="276" width="252" height="36" rx="18" fill="#262626"/>
    <circle cx="32" cy="294" r="12" fill="#3797F0"/>
    <rect x="25.5" y="289.5" width="13" height="9.5" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="32" cy="294.2" r="2.4" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <text x="52" y="299" font-size="15" fill="#A8A8A8">Message…</text>
  </g>
</svg>
